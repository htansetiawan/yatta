<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}} · Yatta</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{URL}}">
  <meta property="og:type" content="video.other">
  <meta property="og:site_name" content="Yatta">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{POSTER}}">
  <meta property="og:image:secure_url" content="{{POSTER}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:video" content="{{VIDEO}}">
  <meta property="og:video:secure_url" content="{{VIDEO}}">
  <meta property="og:video:type" content="video/mp4">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:image" content="{{POSTER}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Shippori+Mincho+B1:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --washi: #f6f3ed; --sumi: #1b1a17; --sumi-2: #5e5a52; --sumi-3: #9a958b; --line: #e7e1d6; --shu: #d2392b; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: var(--washi); color: var(--sumi); font: 15px/1.6 Inter, "Noto Sans JP", -apple-system, sans-serif; padding: 32px 16px; -webkit-font-smoothing: antialiased; }
    main { width: min(560px, 100%); display: flex; flex-direction: column; gap: 16px; }
    video { width: 100%; aspect-ratio: 1; display: block; background: #0e0d0c; border-radius: 18px; box-shadow: 0 1px 2px rgba(27,26,23,.05), 0 18px 50px rgba(27,26,23,.12); }
    h1 { font-family: "Shippori Mincho B1", serif; font-size: 22px; font-weight: 600; margin: 4px 0 0; letter-spacing: .01em; }
    .by { display: flex; align-items: center; gap: 10px; color: var(--sumi-2); font-size: 13px; }
    .by a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .seal { width: 22px; height: 22px; border-radius: 6px; background: var(--shu); color: #fbf9f5; display: grid; place-items: center;
      font-family: "Shippori Mincho B1", serif; font-weight: 700; font-size: 14px; line-height: 1; }
    .note { color: var(--sumi-3); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  </style>
</head>
<body>
  <main>
    <video src="{{VIDEO}}" poster="{{POSTER}}" controls playsinline preload="metadata"></video>
    <h1>{{TITLE}}</h1>
    <div class="by"><a href="/"><span class="seal">や</span>Made with Yatta</a></div>
    <p class="note">An AI-generated talking video. やった</p>
  </main>
</body>
</html>
