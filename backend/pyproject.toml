[project]
name = "yatta"
version = "0.1.0"
description = "Yatta (やった) — personal avatar studio: API and render services"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yatta*"]

[tool.setuptools.package-data]
yatta = ["catalog/*.json", "templates/*.html", "training/*.sh", "training/*.py", "training/configs/*.py"]
