name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "web/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The landing page shares the studio's brand assets instead of keeping copies.
      - run: cp web/public/favicon.svg web/public/favicon-32.png web/public/apple-touch-icon.png web/public/og.jpg site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
